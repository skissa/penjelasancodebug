<!DOCTYPE html>
<!--
  ============================================================
  README — Form Data Mahasiswa
  ============================================================
  DESKRIPSI:
    Aplikasi web sederhana untuk mengelola data mahasiswa.
    Mendukung operasi CRUD (Create, Read, Update, Delete)
    langsung di browser tanpa server.

  FITUR:
    - Input data: NIM, Nama, Alamat, Jenis Kelamin, TTL, Password
    - Validasi wajib isi (NIM, Nama, Jenis Kelamin)
    - Cek duplikat NIM
    - Simpan data ke localStorage (tetap ada setelah refresh)
    - Tabel data dinamis dengan nomor urut
    - Password ditampilkan sebagai ●●● di tabel (masking)
    - Tombol Edit: isi ulang form dengan data yang dipilih
    - Tombol Hapus: konfirmasi sebelum menghapus
    - Mode Edit ditandai dengan bar kuning + tombol berubah
    - Tombol Reset mengosongkan semua field termasuk radio

  TEKNOLOGI:
    - HTML5   : Struktur halaman & form
    - CSS3    : Styling & layout responsif
    - JavaScript (Vanilla) : Logika CRUD & DOM manipulation
    - localStorage : Penyimpanan data di sisi klien

  STRUKTUR FILE:
    Satu file HTML berisi semua bagian (HTML + CSS + JS)
    ├── <head>     : meta, style
    ├── <body>
    │   ├── <form> : Panel input data mahasiswa
    │   └── <table>: Panel tampilan data
    └── <script>   : Semua logika JavaScript

  BUG YANG DIPERBAIKI:
    1. <style> dipindah ke dalam <head> (sebelumnya di luar)
    2. Dropdown tanggal & tahun diisi otomatis via JavaScript
    3. Form submit ditangani event listener (bukan inline onclick)
    4. Tombol Reset direset manual agar radio & select ikut reset
    5. Fungsi Edit & Hapus ditambahkan lengkap
    6. Password di tabel di-masking dengan karakter ●
    7. Validasi field wajib + cek duplikat NIM ditambahkan
    8. Kolom nomor urut (#) ditambahkan di tabel

  CARA PAKAI:
    1. Buka file ini di browser (double-click atau drag ke browser)
    2. Isi semua field yang wajib (NIM, Nama, Jenis Kelamin)
    3. Klik Submit untuk menyimpan
    4. Klik Edit pada baris untuk mengubah data
    5. Klik Hapus pada baris untuk menghapus data
  ============================================================
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa</title>

  <!-- ======================================================
    CSS — Styling Halaman
    Mengatur tampilan form, tabel, tombol, dan indikator
    mode edit.
  ====================================================== -->
  <style>
    /* Reset dasar & font */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f696ce;
    }

    /* Panel form: latar putih dengan sudut melengkung */
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* Semua input, textarea, select: lebar penuh */
    input:not([type="radio"]),
    textarea,
    select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px;
      box-sizing: border-box; /* FIX: agar tidak meluber keluar form */
    }

    /* Styling tombol dasar */
    button {
      padding: 10px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Warna tombol Submit (hijau) dan Reset (merah) */
    .submit { background: green;          color: white; }
    .reset  { background: rgb(252,12,28); color: white; }

    /* Bar indikator mode edit — tersembunyi secara default */
    #editModeBar {
      display: none;              /* disembunyikan saat mode tambah */
      background: #fff8e1;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-weight: bold;
      color: #92400e;
    }

    /* Tabel data: lebar penuh, latar putih */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    /* Sel tabel: garis tipis abu, padding, rata tengah */
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    /* Header tabel: latar abu gelap & teks putih */
    th {
      background: #555;
      color: #fff;
    }

    /* Baris genap diberi warna berbeda agar mudah dibaca */
    tbody tr:nth-child(even) {
      background: #fce4f3;
    }

    /* Tombol Edit (kuning) dan Hapus (merah) di kolom Aksi */
    .btn-edit  { background: #f59e0b; color: white; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-hapus { background: #ef4444; color: white; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; }

    /* Teks password di tabel: warna abu agar terkesan disembunyikan */
    .pass-mask { color: #999; letter-spacing: 3px; }
  </style>
</head>
<body>

<!-- ========================================================
  SECTION: Form Input Data Mahasiswa
  - id="formMahasiswa" ditangkap oleh event listener submit
  - Berisi semua field input beserta tombol Submit & Reset
======================================================== -->
<h2>Form Data Mahasiswa</h2>

<!-- Bar kuning muncul saat mode Edit aktif -->
<div id="editModeBar">
  ✏️ Mode Edit — ubah data lalu klik Submit
  <button type="button" onclick="batalEdit()" style="margin-left:12px;background:#92400e;color:white;padding:4px 10px;border:none;border-radius:4px;cursor:pointer;">
    ✕ Batal
  </button>
</div>

<form id="formMahasiswa">

  <!-- Field NIM: wajib diisi, maksimal 20 karakter -->
  <label>NIM</label>
  <input type="text" id="nim" maxlength="20" placeholder="Contoh: 2021001234" required>

  <!-- Field Nama: wajib diisi -->
  <label>Nama</label>
  <input type="text" id="nama" placeholder="Nama lengkap" required>

  <!-- Field Alamat: opsional, textarea agar bisa multi-baris -->
  <label>Alamat</label>
  <textarea id="alamat" rows="3" placeholder="Jalan, RT/RW, Kota..."></textarea>

  <!-- Radio Jenis Kelamin: harus pilih salah satu -->
  <label>Jenis Kelamin</label><br>
  <input type="radio" name="jk" value="Pria">   Pria &nbsp;
  <input type="radio" name="jk" value="Wanita"> Wanita
  <br><br>

  <!-- Tanggal Lahir: tiga dropdown (hari, bulan, tahun) -->
  <!-- Dropdown tanggal & tahun diisi otomatis oleh JavaScript -->
  <label>Tanggal Lahir</label>
  <select id="tanggal"></select>  <!-- diisi JS: 01–31 -->
  <select id="bulan">            <!-- ditulis manual di HTML -->
    <option value="01">Januari</option>
    <option value="02">Februari</option>
    <option value="03">Maret</option>
    <option value="04">April</option>
    <option value="05">Mei</option>
    <option value="06">Juni</option>
    <option value="07">Juli</option>
    <option value="08">Agustus</option>
    <option value="09">September</option>
    <option value="10">Oktober</option>
    <option value="11">November</option>
    <option value="12">Desember</option>
  </select>
  <select id="tahun"></select>   <!-- diisi JS: tahun sekarang mundur ke 1970 -->

  <!-- Field Password: opsional, type=password agar karakter tersembunyi -->
  <label>Password</label>
  <input type="password" id="password" placeholder="Opsional">

  <!-- Tombol Submit & Reset -->
  <br>
  <button type="submit" class="submit" id="btnSubmit">Submit</button>
  <button type="button" class="reset"  onclick="resetForm()">Reset</button>
  <!--
    CATATAN:
    - type="submit" → memicu event 'submit' pada form (ditangani JS)
    - type="button" + onclick → Reset manual agar radio & select
      ikut direset (type="reset" bawaan HTML tidak reset custom state)
  -->

</form>

<!-- ========================================================
  SECTION: Tabel Data Mahasiswa
  - thead: header kolom (ditulis statis di HTML)
  - tbody#tableBody: isi baris dirender oleh fungsi render() di JS
======================================================== -->
<h2>Data Mahasiswa</h2>
<table>
  <thead>
    <tr>
      <th>#</th>       <!-- Nomor urut -->
      <th>NIM</th>
      <th>Nama</th>
      <th>Alamat</th>
      <th>JK</th>      <!-- Jenis Kelamin -->
      <th>TTL</th>     <!-- Tempat/Tanggal Lahir -->
      <th>Password</th>
      <th>Aksi</th>    <!-- Tombol Edit & Hapus -->
    </tr>
  </thead>
  <!-- Baris tabel diisi otomatis oleh JavaScript (fungsi render()) -->
  <tbody id="tableBody"></tbody>
</table>


<!-- ========================================================
  JAVASCRIPT — Logika Aplikasi
  Ditempatkan di akhir <body> agar HTML sudah siap dibaca
  sebelum script dijalankan.

  DAFTAR FUNGSI:
    - Inisialisasi dropdown tanggal & tahun
    - getData()    : baca data dari localStorage
    - saveData()   : tulis data ke localStorage
    - render()     : gambar ulang isi tabel
    - [submit]     : tambah / update data
    - edit(idx)    : isi form dengan data baris yang dipilih
    - batalEdit()  : batalkan mode edit, kembali ke mode tambah
    - hapus(idx)   : hapus satu baris data
    - resetForm()  : kosongkan semua field form
======================================================== -->
<script>

  // ----------------------------------------------------------
  // INISIALISASI DROPDOWN
  // Mengisi pilihan tanggal (01–31) dan tahun (sekarang–1970)
  // secara otomatis agar tidak perlu ditulis manual di HTML.
  // ----------------------------------------------------------
  const selTanggal = document.getElementById('tanggal');
  const selBulan   = document.getElementById('bulan');
  const selTahun   = document.getElementById('tahun');

  // Isi dropdown tanggal: 01 sampai 31
  for (let d = 1; d <= 31; d++) {
    const val = String(d).padStart(2, '0'); // "01", "02", ..., "31"
    selTanggal.innerHTML += `<option value="${val}">${val}</option>`;
  }

  // Isi dropdown tahun: dari tahun sekarang mundur ke 1970
  const tahunSekarang = new Date().getFullYear();
  for (let y = tahunSekarang; y >= 1970; y--) {
    selTahun.innerHTML += `<option value="${y}">${y}</option>`;
  }

  // Nama bulan lengkap (indeks 0 = Januari)
  const NAMA_BULAN = [
    'Januari','Februari','Maret','April','Mei','Juni',
    'Juli','Agustus','September','Oktober','November','Desember'
  ];

  // ----------------------------------------------------------
  // MANAJEMEN DATA — localStorage
  // Data disimpan sebagai JSON string dengan key 'mahasiswa'.
  // ----------------------------------------------------------

  // Membaca array data dari localStorage (default: array kosong)
  function getData() {
    return JSON.parse(localStorage.getItem('mahasiswa') || '[]');
  }

  // Menyimpan array data ke localStorage sebagai JSON string
  function saveData(arr) {
    localStorage.setItem('mahasiswa', JSON.stringify(arr));
  }

  // ----------------------------------------------------------
  // RENDER — Menggambar Ulang Tabel
  // Dipanggil setiap kali data berubah (tambah/edit/hapus).
  // Menggunakan template literal untuk membuat HTML baris tabel.
  // ----------------------------------------------------------
  function render() {
    const data  = getData();
    const tbody = document.getElementById('tableBody');

    // Jika tidak ada data, tampilkan baris kosong informatif
    if (data.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="color:#999;font-style:italic;padding:20px;">
            Belum ada data. Silakan isi form di atas.
          </td>
        </tr>`;
      return;
    }

    // Buat HTML untuk setiap baris data
    tbody.innerHTML = data.map((m, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${m.nim}</td>
        <td>${m.nama}</td>
        <td>${m.alamat || '-'}</td>
        <td>${m.jk}</td>
        <td>${m.tanggal} ${NAMA_BULAN[parseInt(m.bulan) - 1]} ${m.tahun}</td>
        <!-- Password ditampilkan sebagai ●●● sesuai panjang aslinya (masking) -->
        <td class="pass-mask">${m.password ? '●'.repeat(m.password.length) : '-'}</td>
        <td>
          <!-- onclick meneruskan indeks (i) ke fungsi edit/hapus -->
          <button class="btn-edit"  onclick="edit(${i})">✏️ Edit</button>
          <button class="btn-hapus" onclick="hapus(${i})">🗑 Hapus</button>
        </td>
      </tr>
    `).join('');
  }

  // ----------------------------------------------------------
  // VARIABEL MODE EDIT
  // editIdx = -1  → mode tambah (default)
  // editIdx >= 0  → mode edit, menyimpan indeks baris yang diedit
  // ----------------------------------------------------------
  let editIdx = -1;

  // ----------------------------------------------------------
  // EVENT SUBMIT FORM — Tambah atau Update Data
  // Menangkap event submit form agar bisa dicegah (preventDefault)
  // sebelum melakukan validasi dan penyimpanan data.
  // ----------------------------------------------------------
  document.getElementById('formMahasiswa').addEventListener('submit', function (e) {
    e.preventDefault(); // cegah reload halaman (perilaku default form HTML)

    // Ambil nilai dari setiap field
    const nim      = document.getElementById('nim').value.trim();
    const nama     = document.getElementById('nama').value.trim();
    const alamat   = document.getElementById('alamat').value.trim();
    const jkEl     = document.querySelector('input[name="jk"]:checked'); // radio yang dipilih
    const tanggal  = selTanggal.value;
    const bulan    = selBulan.value;
    const tahun    = selTahun.value;
    const password = document.getElementById('password').value;

    // VALIDASI: field wajib tidak boleh kosong
    if (!nim || !nama) {
      alert('⚠️ NIM dan Nama wajib diisi!');
      return;
    }
    if (!jkEl) {
      alert('⚠️ Jenis Kelamin wajib dipilih!');
      return;
    }

    // Buat objek data mahasiswa baru
    const dataBaru = { nim, nama, alamat, jk: jkEl.value, tanggal, bulan, tahun, password };
    const data = getData();

    if (editIdx >= 0) {
      // ── MODE EDIT ──
      // Cek duplikat NIM: boleh sama jika itu milik baris yang sedang diedit
      const duplikat = data.some((m, i) => m.nim === nim && i !== editIdx);
      if (duplikat) {
        alert('⚠️ NIM sudah dipakai mahasiswa lain!');
        return;
      }
      data[editIdx] = dataBaru; // timpa data lama dengan data baru
      saveData(data);
      render();
      batalEdit(); // kembali ke mode tambah
      alert('✅ Data berhasil diperbarui!');

    } else {
      // ── MODE TAMBAH ──
      // Cek duplikat NIM di seluruh data
      if (data.some(m => m.nim === nim)) {
        alert('⚠️ NIM sudah terdaftar!');
        return;
      }
      data.push(dataBaru); // tambahkan ke array
      saveData(data);
      render();
      resetForm();
      alert('✅ Data berhasil disimpan!');
    }
  });

  // ----------------------------------------------------------
  // FUNGSI EDIT — Mengisi Form dengan Data Baris yang Dipilih
  // Dipanggil saat tombol ✏️ Edit ditekan.
  // idx = indeks baris di array data.
  // ----------------------------------------------------------
  function edit(idx) {
    const data = getData();
    const m    = data[idx];

    // Isi setiap field form dengan nilai data yang ada
    document.getElementById('nim').value     = m.nim;
    document.getElementById('nama').value    = m.nama;
    document.getElementById('alamat').value  = m.alamat;
    document.getElementById('password').value = m.password;

    // Centang radio jenis kelamin yang sesuai
    document.querySelectorAll('input[name="jk"]').forEach(r => {
      r.checked = (r.value === m.jk);
    });

    // Set nilai dropdown tanggal lahir
    selTanggal.value = m.tanggal;
    selBulan.value   = m.bulan;
    selTahun.value   = m.tahun;

    // Aktifkan mode edit: tampilkan bar kuning & ubah teks tombol
    editIdx = idx;
    document.getElementById('editModeBar').style.display = 'block';
    document.getElementById('btnSubmit').textContent = '💾 Update Data';
    document.getElementById('btnSubmit').style.background = '#f59e0b';

    // Scroll ke atas agar form terlihat
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ----------------------------------------------------------
  // FUNGSI BATAL EDIT — Kembali ke Mode Tambah
  // Mereset editIdx dan menyembunyikan bar edit.
  // ----------------------------------------------------------
  function batalEdit() {
    editIdx = -1;
    document.getElementById('editModeBar').style.display = 'none';
    document.getElementById('btnSubmit').textContent       = 'Submit';
    document.getElementById('btnSubmit').style.background  = 'green';
    resetForm();
  }

  // ----------------------------------------------------------
  // FUNGSI HAPUS — Menghapus Satu Baris Data
  // Menampilkan konfirmasi sebelum benar-benar menghapus.
  // idx = indeks baris di array data.
  // ----------------------------------------------------------
  function hapus(idx) {
    const konfirmasi = confirm('🗑 Yakin ingin menghapus data ini?');
    if (!konfirmasi) return; // batal jika pengguna klik Cancel

    const data = getData();
    data.splice(idx, 1); // hapus 1 elemen di indeks idx
    saveData(data);
    render();
  }

  // ----------------------------------------------------------
  // FUNGSI RESET FORM — Mengosongkan Semua Field
  // Dipanggil tombol Reset dan setelah data berhasil disimpan.
  // Mengosongkan manual karena type="reset" tidak menangani
  // radio button dan select yang diisi via JavaScript.
  // ----------------------------------------------------------
  function resetForm() {
    document.getElementById('nim').value      = '';
    document.getElementById('nama').value     = '';
    document.getElementById('alamat').value   = '';
    document.getElementById('password').value = '';

    // Hapus centang semua radio button jenis kelamin
    document.querySelectorAll('input[name="jk"]').forEach(r => r.checked = false);

    // Kembalikan dropdown ke pilihan pertama (index 0)
    selTanggal.selectedIndex = 0;
    selBulan.selectedIndex   = 0;
    selTahun.selectedIndex   = 0;
  }

  // ----------------------------------------------------------
  // JALANKAN RENDER SAAT HALAMAN PERTAMA KALI DIBUKA
  // Menampilkan data yang sudah tersimpan di localStorage
  // (jika ada) tanpa perlu reload atau input ulang.
  // ----------------------------------------------------------
  render();

</script>
</body>
</html>
