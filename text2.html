<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa</title>

  <style>
    /* Reset dasar & font */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f696ce;
    }

    /* Panel form: latar putih dengan sudut melengkung */
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* Semua input, textarea, select: lebar penuh */
    input:not([type="radio"]),
    textarea,
    select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px;
      box-sizing: border-box;
    }

    /* Styling tombol dasar */
    button {
      padding: 10px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Warna tombol Submit (hijau) dan Reset (merah) */
    .submit { background: green;          color: white; }
    .reset  { background: rgb(252,12,28); color: white; }

    /* Bar indikator mode edit — tersembunyi secara default */
    #editModeBar {
      display: none;
      background: #fff8e1;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-weight: bold;
      color: #92400e;
    }

    /* Container Pencarian */
    .search-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    /* Input Pencarian Khusus */
    #searchInput {
      width: 300px; /* Lebar khusus untuk search */
      margin: 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    /* Tabel data: lebar penuh, latar putih */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    /* Sel tabel: garis tipis abu, padding, rata tengah */
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    /* Header tabel: latar abu gelap & teks putih */
    th {
      background: #555;
      color: #fff;
    }

    /* Baris genap diberi warna berbeda agar mudah dibaca */
    tbody tr:nth-child(even) {
      background: #fce4f3;
    }

    /* Tombol Edit (kuning) dan Hapus (merah) di kolom Aksi */
    .btn-edit  { background: #f59e0b; color: white; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-hapus { background: #ef4444; color: white; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; }

    /* Teks password di tabel: warna abu agar terkesan disembunyikan */
    .pass-mask { color: #999; letter-spacing: 3px; }
  </style>
</head>
<body>

<h2>Form Data Mahasiswa</h2>

<!-- Bar kuning muncul saat mode Edit aktif -->
<div id="editModeBar">
  ✏️ Mode Edit — ubah data lalu klik Submit
  <button type="button" onclick="batalEdit()" style="margin-left:12px;background:#92400e;color:white;padding:4px 10px;border:none;border-radius:4px;cursor:pointer;">
    ✕ Batal
  </button>
</div>

<form id="formMahasiswa">
  <label>NIM</label>
  <input type="text" id="nim" maxlength="20" placeholder="Contoh: 2021001234" required>

  <label>Nama</label>
  <input type="text" id="nama" placeholder="Nama lengkap" required>

  <label>Alamat</label>
  <textarea id="alamat" rows="3" placeholder="Jalan, RT/RW, Kota..."></textarea>

  <label>Jenis Kelamin</label><br>
  <input type="radio" name="jk" value="Pria">   Pria &nbsp;
  <input type="radio" name="jk" value="Wanita"> Wanita
  <br><br>

  <label>Tanggal Lahir</label>
  <select id="tanggal"></select>
  <select id="bulan">
    <option value="01">Januari</option>
    <option value="02">Februari</option>
    <option value="03">Maret</option>
    <option value="04">April</option>
    <option value="05">Mei</option>
    <option value="06">Juni</option>
    <option value="07">Juli</option>
    <option value="08">Agustus</option>
    <option value="09">September</option>
    <option value="10">Oktober</option>
    <option value="11">November</option>
    <option value="12">Desember</option>
  </select>
  <select id="tahun"></select>

  <label>Password</label>
  <input type="password" id="password" placeholder="Opsional">

  <br>
  <button type="submit" class="submit" id="btnSubmit">Submit</button>
  <button type="button" class="reset"  onclick="resetForm()">Reset</button>
</form>

<!-- Header Data dan Fitur Pencarian -->
<div style="display: flex; justify-content: space-between; align-items: flex-end;">
  <h2>Data Mahasiswa</h2>
  <div class="search-container">
    <!-- oninput memicu fungsi render() setiap kali user mengetik sesuatu -->
    <input type="text" id="searchInput" placeholder="🔍 Cari NIM atau Nama..." oninput="render()">
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>NIM</th>
      <th>Nama</th>
      <th>Alamat</th>
      <th>JK</th>
      <th>TTL</th>
      <th>Password</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  // Inisialisasi dropdown tanggal dan tahun
  const selTanggal = document.getElementById('tanggal');
  const selBulan   = document.getElementById('bulan');
  const selTahun   = document.getElementById('tahun');

  for (let d = 1; d <= 31; d++) {
    const val = String(d).padStart(2, '0');
    selTanggal.innerHTML += `<option value="${val}">${val}</option>`;
  }

  const tahunSekarang = new Date().getFullYear();
  for (let y = tahunSekarang; y >= 1970; y--) {
    selTahun.innerHTML += `<option value="${y}">${y}</option>`;
  }

  const NAMA_BULAN = [
    'Januari','Februari','Maret','April','Mei','Juni',
    'Juli','Agustus','September','Oktober','November','Desember'
  ];

  // Fungsi LocalStorage
  function getData() {
    return JSON.parse(localStorage.getItem('mahasiswa') || '[]');
  }

  function saveData(arr) {
    localStorage.setItem('mahasiswa', JSON.stringify(arr));
  }

  let editIdx = -1;

  // ----------------------------------------------------------
  // RENDER DENGAN FITUR PENCARIAN
  // ----------------------------------------------------------
  function render() {
    const data  = getData();
    const tbody = document.getElementById('tableBody');
    
    // Ambil kata kunci pencarian (jadikan huruf kecil semua agar tidak case-sensitive)
    const searchInput = document.getElementById('searchInput');
    const keyword = searchInput ? searchInput.value.toLowerCase() : '';

    // Filter data berdasarkan kata kunci (mencari kecocokan di NIM atau Nama)
    const filteredData = data.filter(m => 
      m.nim.toLowerCase().includes(keyword) || 
      m.nama.toLowerCase().includes(keyword)
    );

    // Jika data kosong atau hasil pencarian tidak ada
    if (filteredData.length === 0) {
      const pesan = keyword ? `Pencarian "${keyword}" tidak ditemukan.` : 'Belum ada data. Silakan isi form di atas.';
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="color:#999;font-style:italic;padding:20px;">
            ${pesan}
          </td>
        </tr>`;
      return;
    }

    // Render baris tabel dari data yang sudah difilter
    tbody.innerHTML = filteredData.map((m, i) => {
      // PENTING: Cari indeks asli dari array keseluruhan agar fungsi Edit & Hapus tidak salah target!
      const originalIdx = data.indexOf(m);

      return `
      <tr>
        <td>${i + 1}</td>
        <td>${m.nim}</td>
        <td>${m.nama}</td>
        <td>${m.alamat || '-'}</td>
        <td>${m.jk}</td>
        <td>${m.tanggal} ${NAMA_BULAN[parseInt(m.bulan) - 1]} ${m.tahun}</td>
        <td class="pass-mask">${m.password ? '●'.repeat(m.password.length) : '-'}</td>
        <td>
          <!-- Gunakan originalIdx untuk memastikan target edit dan hapus tetap akurat -->
          <button class="btn-edit"  onclick="edit(${originalIdx})">✏️ Edit</button>
          <button class="btn-hapus" onclick="hapus(${originalIdx})">🗑 Hapus</button>
        </td>
      </tr>
    `}).join('');
  }

  // Event Listener Form Submit
  document.getElementById('formMahasiswa').addEventListener('submit', function (e) {
    e.preventDefault();

    const nim      = document.getElementById('nim').value.trim();
    const nama     = document.getElementById('nama').value.trim();
    const alamat   = document.getElementById('alamat').value.trim();
    const jkEl     = document.querySelector('input[name="jk"]:checked');
    const tanggal  = selTanggal.value;
    const bulan    = selBulan.value;
    const tahun    = selTahun.value;
    const password = document.getElementById('password').value;

    if (!nim || !nama) {
      alert('⚠️ NIM dan Nama wajib diisi!');
      return;
    }
    if (!jkEl) {
      alert('⚠️ Jenis Kelamin wajib dipilih!');
      return;
    }

    const dataBaru = { nim, nama, alamat, jk: jkEl.value, tanggal, bulan, tahun, password };
    const data = getData();

    if (editIdx >= 0) {
      const duplikat = data.some((m, i) => m.nim === nim && i !== editIdx);
      if (duplikat) {
        alert('⚠️ NIM sudah dipakai mahasiswa lain!');
        return;
      }
      data[editIdx] = dataBaru;
      saveData(data);
      render();
      batalEdit();
      alert('✅ Data berhasil diperbarui!');
    } else {
      if (data.some(m => m.nim === nim)) {
        alert('⚠️ NIM sudah terdaftar!');
        return;
      }
      data.push(dataBaru);
      saveData(data);
      render();
      resetForm();
      alert('✅ Data berhasil disimpan!');
    }
  });

  // Fungsi Edit
  function edit(idx) {
    const data = getData();
    const m    = data[idx];

    document.getElementById('nim').value      = m.nim;
    document.getElementById('nama').value     = m.nama;
    document.getElementById('alamat').value   = m.alamat;
    document.getElementById('password').value = m.password;

    document.querySelectorAll('input[name="jk"]').forEach(r => {
      r.checked = (r.value === m.jk);
    });

    selTanggal.value = m.tanggal;
    selBulan.value   = m.bulan;
    selTahun.value   = m.tahun;

    editIdx = idx;
    document.getElementById('editModeBar').style.display = 'block';
    document.getElementById('btnSubmit').textContent = '💾 Update Data';
    document.getElementById('btnSubmit').style.background = '#f59e0b';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Fungsi Batal Edit
  function batalEdit() {
    editIdx = -1;
    document.getElementById('editModeBar').style.display = 'none';
    document.getElementById('btnSubmit').textContent       = 'Submit';
    document.getElementById('btnSubmit').style.background  = 'green';
    resetForm();
  }

  // Fungsi Hapus
  function hapus(idx) {
    const konfirmasi = confirm('🗑 Yakin ingin menghapus data ini?');
    if (!konfirmasi) return;

    const data = getData();
    data.splice(idx, 1);
    saveData(data);
    render();
  }

  // Fungsi Reset Form
  function resetForm() {
    document.getElementById('nim').value      = '';
    document.getElementById('nama').value     = '';
    document.getElementById('alamat').value   = '';
    document.getElementById('password').value = '';

    document.querySelectorAll('input[name="jk"]').forEach(r => r.checked = false);

    selTanggal.selectedIndex = 0;
    selBulan.selectedIndex   = 0;
    selTahun.selectedIndex   = 0;
  }

  // Jalankan render pertama kali
  render();

</script>
</body>
</html>
